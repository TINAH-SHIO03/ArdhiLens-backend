services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ardhilens-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - app_storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ardhilens

  mysql:
    image: mysql:8.0
    container_name: ardhilens-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ardhilens}
      MYSQL_USER: ${DB_USERNAME:-ardhilens}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ardhilens_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_change_me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - ardhilens

volumes:
  mysql_data:
    driver: local
  app_storage:
    driver: local

networks:
  ardhilens:
    driver: bridge
